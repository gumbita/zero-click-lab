name: Safe CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safe Python tests
        run: python -m unittest discover -s tests -v

      - name: Configure Native Core
        run: cmake -S native-core -B "${{ runner.temp }}/echocall-native" -DENABLE_ASAN=OFF

      - name: Build safe native targets
        run: cmake --build "${{ runner.temp }}/echocall-native" --target test_safe_parser receiver_safe

      - name: Run safe native tests
        run: ctest --test-dir "${{ runner.temp }}/echocall-native" --output-on-failure
